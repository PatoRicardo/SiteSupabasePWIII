<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Filmes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <h1>🎬 Catálogo de Filmes</h1>
      <p>Cadastre, consulte, altere e exclua seus filmes favoritos</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="form-title">Cadastrar Filme</h2>
      <form id="filme-form">
        <input type="hidden" id="filme-id" />

        <div class="grid">
          <div class="field">
            <label for="titulo">Título *</label>
            <input type="text" id="titulo" required placeholder="Ex.: O Poderoso Chefão" />
          </div>

          <div class="field">
            <label for="genero">Gênero *</label>
            <select id="genero" required>
              <option value="">Selecione...</option>
              <option value="Ação">Ação</option>
              <option value="Animação">Animação</option>
              <option value="Aventura">Aventura</option>
              <option value="Comédia">Comédia</option>
              <option value="Documentário">Documentário</option>
              <option value="Drama">Drama</option>
              <option value="Ficção Científica">Ficção Científica</option>
              <option value="Terror">Terror</option>
              <option value="Romance">Romance</option>
              <option value="Suspense">Suspense</option>
              <option value="Outro">Outro</option>
            </select>
          </div>

          <div class="field">
            <label for="ano">Ano *</label>
            <input type="number" id="ano" min="1888" max="2100" required placeholder="Ex.: 1972" />
          </div>

          <div class="field">
            <label for="diretor">Diretor *</label>
            <input type="text" id="diretor" required placeholder="Ex.: Francis Ford Coppola" />
          </div>

          <div class="field">
            <label for="nota">Nota (0 a 10)</label>
            <input type="number" id="nota" min="0" max="10" step="0.1" placeholder="Ex.: 9.2" />
          </div>

          <div class="field field-full">
            <label for="sinopse">Sinopse</label>
            <textarea id="sinopse" rows="3" placeholder="Resumo do filme..."></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="btn-salvar">Salvar</button>
          <button type="button" class="btn btn-secondary" id="btn-cancelar" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>Meus Filmes (<span id="contador">0</span>)</h2>
        <input type="search" id="busca" placeholder="Buscar por título, gênero ou diretor..." />
      </div>

      <div id="mensagem" class="mensagem" hidden></div>

      <div id="lista-filmes" class="lista-filmes">
        <p class="vazio">Nenhum filme cadastrado ainda.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Projeto Atividade Supabase — PWIII — Catálogo de Filmes com CRUD via Supabase</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
